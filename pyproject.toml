[project]
name = "td-string"
version = "0.1.0"
description = "Custom 5bit text encoding"
readme = "README.md"
license = {text = "AGPL-3.0"}
authors = [
    {name = "anchor-the-dev", email = "matyytam@duck.com" }
]
requires-python = ">=3.9"
dependencies = ["jsonlines"]

classifiers = [ 
"Programming Language :: Python :: 3",
"Operating System :: OS Independent"
] 

[project.scripts]
td-string = "td_string:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
